name: sheriff-bot

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sheriff}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      APP_DB_USER: "${APP_DB_USER:-sheriff_app}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/001-init-app.sh:ro
      - ./db_schema.sql:/opt/sheriff/schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}"
      DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER:-sheriff_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sheriff}"
      ADMIN_IDS: "${ADMIN_IDS:-}"
      CLUB_TZ: "${CLUB_TZ:-Europe/Moscow}"
      RATINGS_API_BASE_URL: "${RATINGS_API_BASE_URL:-http://127.0.0.1:8080}"
      RATINGS_API_TIMEOUT: "${RATINGS_API_TIMEOUT:-5}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
